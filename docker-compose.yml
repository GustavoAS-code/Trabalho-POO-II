services:
  postgres_locadora:
    image: postgres:16-alpine
    container_name: locadora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locadora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locadora_pass}
      POSTGRES_DB: ${POSTGRES_DB:-locadora_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_locadora_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locadora_user} -d ${POSTGRES_DB:-locadora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_locadora_data: